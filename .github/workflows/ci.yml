name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release and current stable: a library should
        # not silently require a newer toolchain than it declares.
        go: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Verify formatting
        run: make fmt-check
      - name: Vet
        run: go vet ./...
      - name: Test (all modules)
        run: make test
      - name: Race detector
        run: make race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Lint gates regressions while this repository pays down legacy
          # warnings; compare against the previous commit so unchanged
          # baseline issues do not fail unrelated pull requests.
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      # golangci-lint is installed and run from a plain shell step rather
      # than golangci-lint-action. That action's own action.yml still
      # declares `using: node20`, so it prints a Node 20 deprecation
      # banner on every run regardless of the versions pinned elsewhere.
      # A `run:` step uses no Node at all, which is what keeps this whole
      # workflow free of Node-20 actions. The version is pinned for
      # reproducibility; bump it deliberately.
      - name: golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.12.2
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          "$(go env GOPATH)/bin/golangci-lint" run --new-from-rev=HEAD~1

  fuzz:
    # Short smoke run on every PR; the parsers are the highest-risk
    # surface and a regression there should not wait for a nightly.
    #
    # `make fuzz` fails when it discovers no targets, so this job cannot
    # go green having executed nothing — which is exactly what it used to
    # do. `make fuzz-list` prints what it is about to run so the log
    # shows the coverage rather than asserting it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - name: List fuzz targets
        run: make fuzz-list
      - name: Fuzz each target briefly
        # FUZZMINIMIZETIME defaults to 60s in the toolchain, which a 20s
        # budget would be spent entirely on. Keep it under the run time.
        run: make fuzz FUZZTIME=20s FUZZMINIMIZETIME=3s

  conformance-sqlite:
    # The SQLite leg keeps CGO for mattn/go-sqlite3 and also carries the
    # Mongo wire-protocol double, which needs no server.
    name: conformance (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - name: SQL adapter and full auth flow against real SQLite
        env:
          CGO_ENABLED: '1'
        run: cd storage/sqlstore/integration && go test ./...
      - name: Mongo adapter against the wire-protocol test double
        # Not a real server: storage/mongostore/internal/fakemongo speaks
        # OP_MSG well enough to exercise the adapter's query building.
        # It cannot catch a server-behaviour difference.
        run: cd storage/mongostore && go test ./...
      - name: Examples compile
        # The examples are the onboarding path; a release where they do
        # not build is a release with a broken front door. basic is
        # covered by the core module's build; the two example modules
        # build here because this job already has cgo for SQLite.
        env:
          CGO_ENABLED: '1'
        run: |
          (cd examples/chi && go vet ./ && go build ./)
          (cd examples/fullapp && go vet ./ && go build ./)

  conformance-postgres:
    # The adapter contract, migration idempotence and the full HTTP auth
    # flow against a real PostgreSQL server. REQUIRE_DSN=1 turns the
    # local-development skip into a failure, so this job cannot go green
    # because the container failed to start and nothing ran.
    name: conformance (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gda
          POSTGRES_PASSWORD: gda
          POSTGRES_DB: gda
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - name: Conformance suite, migrations and auth flow on PostgreSQL
        env:
          POSTGRES_DSN: postgres://gda:gda@localhost:5432/gda?sslmode=disable
          REQUIRE_DSN: '1'
        run: cd storage/sqlstore/integration && go test -run 'Postgres' -v ./...

  conformance-mysql:
    name: conformance (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: gda
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - name: Conformance suite, migrations and auth flow on MySQL
        # root, because the tests create and drop a throwaway database
        # per adapter for isolation.
        env:
          MYSQL_DSN: root:gda@tcp(127.0.0.1:3306)/mysql
          REQUIRE_DSN: '1'
        run: cd storage/sqlstore/integration && go test -run 'MySQL' -v ./...
